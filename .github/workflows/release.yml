name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*' # Сработает при пуше тега, например v0.5.0

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Сборка бинарников для каждой платформы
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (x86_64)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          # Linux (ARM64)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          # macOS (Intel)
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # macOS (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # Windows (x64)
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for ARM Linux)
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package binaries
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="rustdu-${VERSION}-${{ matrix.target }}"
          mkdir "$DIR"
          cp "target/${{ matrix.target }}/release/rustdu" "$DIR/" 2>/dev/null || \
          cp "target/${{ matrix.target }}/release/rustdu.exe" "$DIR/" 2>/dev/null || true
          cp LICENSE.md README.md CHANGELOG.md "$DIR/" 2>/dev/null || true
          
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cd "$DIR" && 7z a "../${DIR}.zip" . && cd ..
          else
            tar czf "${DIR}.tar.gz" "$DIR"
          fi
          
          echo "ASSET=${DIR}.${{ matrix.archive }}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ASSET }}

  # Создание GitHub Release и загрузка всех бинарников
  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true