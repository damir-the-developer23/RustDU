[package]
name = "rustdu"
version = "0.4.0"
edition = "2024"
description = "A fast, interactive terminal disk usage analyze"
authors = ["damirkondratenko23@gmail.com"]
license = "Apache-2.0"
keywords = ["disk", "storage", "analyzer", "cli", "terminal"]
repository = "https://github.com/damirkondratenko23-bot/rustdu"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.28"
crossterm = "0.28"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
once_cell = "1"
directories = "6.0.0"
toml = "1.1.6"

[[bin]]
name = "rustdu"
path = "src/main.rs"
