[package]
name = "rustdu"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "A fast, interactive terminal disk usage analyzer"
authors = ["damirkondratenko23@gmail.com"]
license = "Apache-2.0"
keywords = ["disk", "storage", "analyzer", "cli", "terminal"]
repository = "https://github.com/damir-the-developer23/rustdu"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.28"
crossterm = "0.28"
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }
anyhow = "1"

[profile.dev]
incremental = true
debug = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = false

[[bin]]
name = "rustdu"
path = "src/main.rs"